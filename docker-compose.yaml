services:
  wiremock:
    image: wiremock/wiremock:3.5.2
    container_name: rupass-payment-mock
    ports:
      - "8081:8080"
    command:
      - "--global-response-templating"
      - "--extension"
      - "org.wiremock.webhooks.Webhooks"
    volumes:
      - ./wiremock-data:/home/wiremock


  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rupass-db
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  postgres_data:
